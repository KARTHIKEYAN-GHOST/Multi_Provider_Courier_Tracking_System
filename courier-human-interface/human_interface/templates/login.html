{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block main %}
<h1>Sign in</h1>
<p>Enter an admin's API key to see the verification requests of every organization that are waiting for an answer.</p>
<form method="post" action="/login" class="card">
  <label for="api_key">API key</label>
  <input id="api_key" name="api_key" type="password" autocomplete="off" required maxlength="200" autofocus>
  <button>Sign in</button>
</form>
{% endblock %}
