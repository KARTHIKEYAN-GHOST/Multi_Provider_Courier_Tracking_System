<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block head %}{% endblock %}
  <title>{% block title %}Courier tracking{% endblock %} - verification</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a class="brand" href="/interventions">Courier tracking &middot; verification</a>
  {% if csrf %}
  <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link">Sign out</button></form>
  {% endif %}
</header>
<main>
{% if notice %}<p class="notice {{ notice_kind or 'info' }}">{{ notice }}</p>{% endif %}
{% block main %}{% endblock %}
</main>
</body>
</html>
