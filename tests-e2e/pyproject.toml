[project]
name = "courier-e2e"
version = "0.1.0"
description = "End-to-end tests: Engine + dummy adapter worker through RabbitMQ and PostgreSQL"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pytest>=8",
    "redis>=5.0",
]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-q -p no:cacheprovider"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM", "C4", "PT"]
