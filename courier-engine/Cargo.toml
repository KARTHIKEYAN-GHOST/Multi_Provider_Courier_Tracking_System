[package]
name = "courier-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.105"
axum = "0.8.9"
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
dotenvy = "0.15.7"
envy = "0.4.2"
futures-util = "0.3.34"
hex = "0.4.3"
lapin = { version = "4.13.0", default-features = false, features = ["tokio"] }
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros", "derive"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.29.3", features = ["v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
