# Local stack: PostgreSQL, RabbitMQ, Redis, the Engine, the dummy and demo-site adapter
# workers, the demo courier website and the human interface. The DHL worker is opt-in (it needs an API key and a worker token).
#
# Run through the Makefile, which supplies --env-file .env and the project name:
#   make up-deps   PostgreSQL + RabbitMQ + Redis only (for development and the test suites)
#   make up        everything except DHL
#   make up-dhl    additionally the DHL worker (see docs/phase-6.md)

name: courier

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    hostname: courier-rabbitmq   # stable node name, so the data volume survives container re-creation
    entrypoint: ["/bin/sh", "/opt/courier/entrypoint.sh"]
    command: ["rabbitmq-server"]
    environment:
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_ADMIN_USER: ${RABBITMQ_ADMIN_USER}
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD}
      RABBITMQ_ENGINE_USER: ${RABBITMQ_ENGINE_USER}
      RABBITMQ_ENGINE_PASSWORD: ${RABBITMQ_ENGINE_PASSWORD}
      RABBITMQ_WORKER_USER: ${RABBITMQ_WORKER_USER}
      RABBITMQ_WORKER_PASSWORD: ${RABBITMQ_WORKER_PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_HOST_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-courier.conf:ro
      - ./rabbitmq/definitions.template.json:/opt/courier/definitions.template.json:ro
      - ./rabbitmq/entrypoint.sh:/opt/courier/entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s

  # Session store of the adapter workers: what a lookup needs to continue after a person has
  # answered a one-time code or CAPTCHA. Only workers use it; the Engine never connects.
  # Sessions are encrypted by the workers and expire, so nothing is persisted to disk.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 128mb --maxmemory-policy volatile-ttl"]
    environment:
      # The default keeps a .env written before Phase 8 working; set your own outside local development.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # Applies database migrations once, then exits. The Engine starts only after it succeeded.
  engine-migrate:
    build: &engine-build
      context: ..
      dockerfile: courier-engine/Dockerfile
    image: courier-engine:local
    command: ["migrate"]
    restart: "no"
    environment: &engine-environment
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ENGINE_AMQP_URL: amqp://${RABBITMQ_ENGINE_USER}:${RABBITMQ_ENGINE_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}
      ENGINE_HTTP_ADDR: 0.0.0.0:8080
      # Internal API (credential resolve) for adapter workers. Port 8081 is NOT published to
      # the host: it is reachable only from other containers of this stack.
      ENGINE_INTERNAL_ADDR: 0.0.0.0:8081
      # Empty = no credential store: providers that need a credential stay unavailable.
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:-}
      CREDENTIAL_KEY_VERSION: ${CREDENTIAL_KEY_VERSION:-1}
      ENABLE_DUMMY_PROVIDER: ${ENABLE_DUMMY_PROVIDER:-true}
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy

  engine:
    build: *engine-build
    image: courier-engine:local
    restart: unless-stopped
    environment: *engine-environment
    ports:
      - "127.0.0.1:${ENGINE_HOST_PORT:-8080}:8080"
    depends_on:
      engine-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # The image has no curl; opening the port is enough to know the API is up.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # The worker uses the restricted RabbitMQ account and has no database access at all.
  adapter-dummy:
    build: &worker-build
      context: ..
      dockerfile: courier-adapters/Dockerfile
    image: courier-adapter-worker:local
    command: ["-m", "adapters.dummy"]
    restart: unless-stopped   # a crashed worker comes back and RabbitMQ redelivers its jobs
    stop_grace_period: 40s    # longer than WORKER_SHUTDOWN_GRACE_S, so in-flight jobs can finish
    environment:
      WORKER_AMQP_URL: amqp://${RABBITMQ_WORKER_USER}:${RABBITMQ_WORKER_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_ALLOW_FAULT_INJECTION: ${WORKER_ALLOW_FAULT_INJECTION:-false}
      LOG_FORMAT: json
    depends_on:
      engine:
        condition: service_healthy   # the Engine declares the queues the worker reads

  # A small local courier website: the practice target of the scraping adapter. Not a real courier.
  demo-site:
    build: *worker-build
    image: courier-adapter-worker:local
    command: ["-m", "demo_site"]
    restart: unless-stopped
    environment:
      DEMO_SITE_HOST: 0.0.0.0
      DEMO_SITE_PORT: "8090"
    ports:
      # Published so a person can open the pretend phone inbox (/inbox?number=...) in a browser.
      - "127.0.0.1:${DEMO_SITE_HOST_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "/app/courier-adapters/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # Scraping adapter. It contacts only the demo site above.
  adapter-demosite:
    build: *worker-build
    image: courier-adapter-worker:local
    command: ["-m", "adapters.demosite"]
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      WORKER_AMQP_URL: amqp://${RABBITMQ_WORKER_USER}:${RABBITMQ_WORKER_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      DEMOSITE_BASE_URL: http://demo-site:8090
      # For shipments behind a one-time code or CAPTCHA (DEMO-OTP-, DEMO-CAPTCHA-): the
      # session store, the key that encrypts sessions in it, and the worker's token for
      # fetching the user's answer from the Engine. Without the last two, ordinary lookups
      # still work and only those shipments fail. See docs/phase-8.md.
      WORKER_SESSION_STORE_URL: redis://:${REDIS_PASSWORD:-dev_redis_password}@redis:6379/0
      WORKER_SESSION_KEY: ${WORKER_SESSION_KEY:-}
      WORKER_ENGINE_INTERNAL_URL: http://engine:8081
      WORKER_TOKEN: ${DEMOSITE_WORKER_TOKEN:-}
      LOG_FORMAT: json
    depends_on:
      engine:
        condition: service_healthy
      demo-site:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The page where a user answers one-time codes and CAPTCHAs. A thin client of the Engine's
  # public API: no database, RabbitMQ or Redis access, and no secrets of its own.
  human-interface:
    build:
      context: ..
      dockerfile: courier-human-interface/Dockerfile
    image: courier-human-interface:local
    restart: unless-stopped
    environment:
      HUMAN_INTERFACE_ENGINE_URL: http://engine:8080
      HUMAN_INTERFACE_COOKIE_SECURE: ${HUMAN_INTERFACE_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${HUMAN_INTERFACE_HOST_PORT:-8088}:8088"
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/courier-human-interface/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # DHL adapter (official API). Started only with the "dhl" profile: make up-dhl.
  # It holds no DHL key: it asks the Engine for it per job, identifying itself with its token.
  adapter-dhl:
    profiles: ["dhl"]
    build: *worker-build
    image: courier-adapter-worker:local
    command: ["-m", "adapters.dhl"]
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      WORKER_AMQP_URL: amqp://${RABBITMQ_WORKER_USER}:${RABBITMQ_WORKER_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}
      WORKER_CONCURRENCY: ${DHL_WORKER_CONCURRENCY:-2}
      WORKER_ENGINE_INTERNAL_URL: http://engine:8081
      WORKER_TOKEN: ${DHL_WORKER_TOKEN:-}
      DHL_BASE_URL: ${DHL_BASE_URL:-https://api-eu.dhl.com}
      LOG_FORMAT: json
    depends_on:
      engine:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
