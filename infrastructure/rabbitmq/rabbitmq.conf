# Loaded after the image defaults (conf.d/10-defaults.conf).

# Vhost, users and permissions are imported at boot. The file is rendered from
# definitions.template.json by entrypoint.sh so that passwords come from the environment.
load_definitions = /etc/rabbitmq/definitions.json

# Refuse messages larger than 1 MiB at the broker. The contract limit is 256 KiB
# (courier-contracts/topology.yaml); this is the hard backstop.
max_message_size = 1048576
