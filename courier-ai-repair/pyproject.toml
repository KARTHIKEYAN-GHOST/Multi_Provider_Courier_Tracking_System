[project]
name = "courier-ai-repair"
version = "0.1.0"
description = "Repairs courier adapters, and writes new ones, with an AI model; checks and publishes the result"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "structlog>=24.4",
]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8", "ruff>=0.8", "types-pyyaml>=6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM", "C4", "PT"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["ai_repair", "tests"]
plugins = ["pydantic.mypy"]
