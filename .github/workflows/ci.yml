name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Schemas, fixtures and topology
        run: make setup test-contracts

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: make compose-config
      - name: Start PostgreSQL, RabbitMQ and Redis
        run: make up-deps
      - name: Verify databases, vhost, users and permissions
        run: make verify-deps
      - name: Container logs on failure
        if: failure()
        run: make ps && docker compose --env-file .env -f infrastructure/docker-compose.yml -p courier logs --tail=200
      - name: Stop
        if: always()
        run: make destroy

  engine:
    name: Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: courier-engine
      - name: Start PostgreSQL, RabbitMQ and Redis
        run: make up-deps
      - name: Migrations apply, and are a no-op the second time
        run: make migrate && make migrate
      - name: Format, lint, test
        run: make test-engine
      - name: Stop
        if: always()
        run: make destroy

  adapters:
    name: Adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Start RabbitMQ and Redis
        run: make up-deps
      - name: Format, lint, type-check, test
        run: make setup test-adapters
      - name: Stop
        if: always()
        run: make destroy

  human-interface:
    name: Human interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Format, lint, type-check, test
        run: make setup test-human-interface

  ai-repair:
    name: AI repair service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The end-to-end tests run generated code in a bubblewrap sandbox; where the runner
      # does not allow one, those tests are skipped and the rest still runs.
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Format, lint, type-check, test
        run: make setup test-ai-repair

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: courier-engine
      - uses: astral-sh/setup-uv@v5
      - name: Start PostgreSQL, RabbitMQ and Redis
        run: make up-deps
      - name: Engine and worker processes, end to end
        run: make setup test-e2e
      - name: Engine and worker logs on failure
        if: failure()
        run: tail -n 300 tests-e2e/logs/*.log
      - name: Stop
        if: always()
        run: make destroy

  containers:
    name: Container stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start Engine and worker containers
        run: make up
      - name: One tracking request through the containers
        run: make smoke
      - name: Container logs on failure
        if: failure()
        run: docker compose --env-file .env -f infrastructure/docker-compose.yml -p courier logs --tail=200
      - name: Stop
        if: always()
        run: make destroy
