[project]
name = "courier-adapters"
version = "0.1.0"
description = "Adapter SDK (worker runtime, message contracts) and courier adapters"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aio-pika>=9.5",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-jsonschema>=4.23", "types-pyyaml>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF", "SIM", "C4", "PT"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["courier_adapter_sdk", "adapters", "tests"]
plugins = ["pydantic.mypy"]
