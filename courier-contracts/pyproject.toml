[project]
name = "courier-contracts"
version = "0.1.0"
description = "Versioned JSON Schemas, fixtures and RabbitMQ topology shared by the Rust Engine and Python adapters"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8",
    "pyyaml>=6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
