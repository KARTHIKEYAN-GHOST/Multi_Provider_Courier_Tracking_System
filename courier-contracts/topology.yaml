# RabbitMQ topology — single source of truth for the Engine (which declares it)
# and for adapter workers (which only look their queue up passively).
#
# Delivery is at-least-once. Every durable queue is a quorum queue with a delivery
# limit and a dead-letter route, so a message that keeps failing ends up in a DLQ
# instead of looping forever.

version: 1
vhost: courier

limits:
  max_message_bytes: 262144   # 256 KiB contract limit; larger payloads are not allowed in Milestone 1

exchanges:
  - name: courier.jobs        # Engine -> workers
    type: topic
    durable: true
  - name: courier.events      # workers -> Engine
    type: topic
    durable: true
  - name: courier.dlx         # dead-letter exchange for every queue below
    type: topic
    durable: true

queues:
  - name: adapter.dummy.jobs
    durable: true
    consumer: adapter-worker
    arguments:
      x-queue-type: quorum
      x-delivery-limit: 3
      x-dead-letter-exchange: courier.dlx
      x-dead-letter-routing-key: adapter.dummy.jobs
    bindings:
      - exchange: courier.jobs
        routing_key: job.track.v1.dummy
      # A lookup continued after a human answer; same queue, same delivery limit.
      - exchange: courier.jobs
        routing_key: job.resume.v1.dummy

  - name: adapter.dhl.jobs
    durable: true
    consumer: adapter-worker
    arguments:
      x-queue-type: quorum
      x-delivery-limit: 3
      x-dead-letter-exchange: courier.dlx
      x-dead-letter-routing-key: adapter.dhl.jobs
    bindings:
      - exchange: courier.jobs
        routing_key: job.track.v1.dhl
      # A lookup continued after a human answer; same queue, same delivery limit.
      - exchange: courier.jobs
        routing_key: job.resume.v1.dhl

  - name: adapter.demosite.jobs
    durable: true
    consumer: adapter-worker
    arguments:
      x-queue-type: quorum
      x-delivery-limit: 3
      x-dead-letter-exchange: courier.dlx
      x-dead-letter-routing-key: adapter.demosite.jobs
    bindings:
      - exchange: courier.jobs
        routing_key: job.track.v1.demosite
      # A lookup continued after a human answer; same queue, same delivery limit.
      - exchange: courier.jobs
        routing_key: job.resume.v1.demosite

  - name: engine.events
    durable: true
    consumer: engine-event-consumer
    arguments:
      x-queue-type: quorum
      x-delivery-limit: 5
      x-dead-letter-exchange: courier.dlx
      x-dead-letter-routing-key: engine.events
    bindings:
      - exchange: courier.events
        routing_key: job.started.v1
      - exchange: courier.events
        routing_key: job.result.v1
      - exchange: courier.events
        routing_key: job.intervention_required.v1

  # Dead-lettered job messages. The Engine consumes this queue: each message still
  # names its job and attempt, so the affected attempt can be closed directly.
  - name: adapter.dummy.jobs.dlq
    durable: true
    consumer: engine-dead-letter-consumer
    arguments:
      x-queue-type: quorum
    bindings:
      - exchange: courier.dlx
        routing_key: adapter.dummy.jobs

  - name: adapter.dhl.jobs.dlq
    durable: true
    consumer: engine-dead-letter-consumer
    arguments:
      x-queue-type: quorum
    bindings:
      - exchange: courier.dlx
        routing_key: adapter.dhl.jobs

  - name: adapter.demosite.jobs.dlq
    durable: true
    consumer: engine-dead-letter-consumer
    arguments:
      x-queue-type: quorum
    bindings:
      - exchange: courier.dlx
        routing_key: adapter.demosite.jobs

  # Events the Engine itself rejected as malformed. Parked for operators; not auto-consumed.
  - name: engine.events.dlq
    durable: true
    consumer: none
    arguments:
      x-queue-type: quorum
    bindings:
      - exchange: courier.dlx
        routing_key: engine.events

# Where each message type is published. {adapter_key} is filled in by the publisher.
# The major schema version is part of the routing key.
routing:
  job.track:
    exchange: courier.jobs
    routing_key: "job.track.v1.{adapter_key}"
    schema: schemas/v1/job.track.schema.json
  job.started:
    exchange: courier.events
    routing_key: job.started.v1
    schema: schemas/v1/job.started.schema.json
  job.result:
    exchange: courier.events
    routing_key: job.result.v1
    schema: schemas/v1/job.result.schema.json
  job.intervention_required:
    exchange: courier.events
    routing_key: job.intervention_required.v1
    schema: schemas/v1/job.intervention_required.schema.json
  job.resume:
    exchange: courier.jobs
    routing_key: "job.resume.v1.{adapter_key}"
    schema: schemas/v1/job.resume.schema.json
